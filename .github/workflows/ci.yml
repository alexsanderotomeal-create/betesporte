name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: lint + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  database:
    name: migrations + fluxos financeiros
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: harness (stub + migrations 2x + asserts)
        shell: pwsh
        run: |
          ./supabase/tests/run.ps1 2>&1 | Tee-Object -Variable log
          if ($LASTEXITCODE -ne 0) {
            # sem acesso aos logs da run via API, o summary e a pista de diagnostico
            $log | Select-Object -Last 40 |
              Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }
          exit $LASTEXITCODE
