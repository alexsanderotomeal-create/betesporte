name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: lint + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  database:
    name: migrations + fluxos financeiros
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: harness (stub + migrations 2x + asserts)
        shell: pwsh
        run: ./supabase/tests/run.ps1
